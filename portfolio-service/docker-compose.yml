version: '3.8'

services:
  portfolio-service:
    build: .
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=cursos_db
      - JWT_SECRET=your-secret-key
      - APP_ENV=development
    depends_on:
      - mysql
    volumes:
      - portfolio_images:/root/static/portfolio
    networks:
      - microservices-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=cursos_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-network

volumes:
  mysql_data:
  portfolio_images:

networks:
  microservices-network:
    driver: bridge