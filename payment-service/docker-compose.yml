docker-compose.prod.yml
version: '3.8'

services:
  payment-service:
    build: .
    container_name: payment-service-prod
    ports:
      - "8002:8002"
    environment:
      # Database
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      
      # Server
      - PORT=8002
      - APP_ENV=production
      
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      
      # External Services
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - COURSE_SERVICE_URL=${COURSE_SERVICE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BASE_URL=${BASE_URL}
      
      # PayPal
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_SECRET=${PAYPAL_SECRET}
      - PAYPAL_ENV=live
      
      # Coinbase
      - COINBASE_COMMERCE_API_KEY=${COINBASE_COMMERCE_API_KEY}
    
    restart: always
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  payment_db_data:
    driver: local

networks:
  payment_network:
    driver: bridge