confelhag<VirtualHost *:80>
    ServerName bpnnneuq.co
    ServerAlias www.bpnnneuq.co

    # Redirect HTTP to HTTPS
    Redirect permanent / https://bpnnneuq.co/
RewriteEngine on
RewriteCond %{SERVER_NAME} =www.bpnnneuq.co [OR]
RewriteCond %{SERVER_NAME} =bpnnneuq.co
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName bpnnneuq.co
    ServerAlias www.bpnnneuq.co

    # Document Root for React Build
    DocumentRoot /var/www/bpnnneuq.co

    # Security Headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Enable proxy module
    ProxyPreserveHost On
    ProxyRequests Off   

    # Set proxy timeout
    ProxyTimeout 300
    
    # Exclude API routes from serving static files  
    ProxyPass /api/ !

    # Auth Service API Routes
    ProxyPass /api/auth/ http://127.0.0.1:8001/api/auth/
    ProxyPassReverse /api/auth/ http://127.0.0.1:8001/api/auth/

    # Payment Service API Routes
    ProxyPass /api/pagos/ http://127.0.0.1:8002/api/pagos/
    ProxyPassReverse /api/pagos/ http://127.0.0.1:8002/api/pagos/

    # Course Service API Routes
    ProxyPass /api/courses/ http://127.0.0.1:8003/api/courses/
    ProxyPassReverse /api/courses/ http://127.0.0.1:8003/api/courses/

    ProxyPass /api/chapters/ http://127.0.0.1:8003/api/chapters/
    ProxyPassReverse /api/chapters/ http://127.0.0.1:8003/api/chapters/

    ProxyPass /api/progress/ http://127.0.0.1:8003/api/progress/
    ProxyPassReverse /api/progress/ http://127.0.0.1:8003/api/progress/

    # Contact Service API Routes
    ProxyPass /api/contact/ http://127.0.0.1:8004/api/contact/
    ProxyPassReverse /api/contact/ http://127.0.0.1:8004/api/contact/

    # Portfolio Service API Routes
    ProxyPass /api/portfolio/ http://127.0.0.1:8005/api/portfolio/
    ProxyPassReverse /api/portfolio/ http://127.0.0.1:8005/api/portfolio/

    # Home Service API Routes
    ProxyPass /api/home/ http://127.0.0.1:8006/api/home/
    ProxyPassReverse /api/home/ http://127.0.0.1:8006/api/home/

    # Admin routes - Auth Service (general admin)
    ProxyPass /api/admin/users/ http://127.0.0.1:8001/api/admin/
    ProxyPassReverse /api/admin/users/ http://127.0.0.1:8001/api/admin/

    ProxyPass /api/admin/stats/ http://127.0.0.1:8001/api/admin/
    ProxyPassReverse /api/admin/stats/ http://127.0.0.1:8001/api/admin/

    # Admin routes - Home Service
    ProxyPass /api/admin/home/ http://127.0.0.1:8006/api/admin/
    ProxyPassReverse /api/admin/home/ http://127.0.0.1:8006/api/admin/

    # Admin routes - Portfolio Service  
    ProxyPass /api/admin/portfolio/ http://127.0.0.1:8005/api/admin/
    ProxyPassReverse /api/admin/portfolio/ http://127.0.0.1:8005/api/admin/

    # Admin routes - Contact Service
    ProxyPass /api/admin/messages/ http://127.0.0.1:8004/api/admin/
    ProxyPassReverse /api/admin/messages/ http://127.0.0.1:8004/api/admin/

    # Admin routes - Course Service
    ProxyPass /api/admin/courses/ http://127.0.0.1:8003/api/admin/
    ProxyPassReverse /api/admin/courses/ http://127.0.0.1:8003/api/admin/

    # Generic admin routes (fallback to auth service)
    ProxyPass /api/admin/ http://127.0.0.1:8001/api/admin/
    ProxyPassReverse /api/admin/ http://127.0.0.1:8001/api/admin/

    # Static files for uploads
    Alias /static/ /home/kali/microservicios/
    <Directory "/home/kali/microservicios/">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Cache static files
        <FilesMatch "\.(jpg|jpeg|png|gif|css|js|ico|svg)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
            Header append Cache-Control "public"
        </FilesMatch>
    </Directory>

    # React Build Directory Configuration
    <Directory "/var/www/bpnnneuq.co">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Handle React Router (SPA routing)
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]

        # Cache static assets
        <FilesMatch "\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
            Header append Cache-Control "public, immutable"
        </FilesMatch>
    </Directory>

    # Error and Access Logs
    ErrorLog ${APACHE_LOG_DIR}/bpnnneuq.co_error.log
    CustomLog ${APACHE_LOG_DIR}/bpnnneuq.co_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/bpnnneuq.co/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/bpnnneuq.co/privkey.pem
</VirtualHost>