version: '3.8'

services:
  home-service:
    build: .
    ports:
      - "8006:8006"
    environment:
      - PORT=8006
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=home_db
      - JWT_SECRET=your-secret-key
      - APP_ENV=development
    depends_on:
      - mysql
    volumes:
      - home_images:/root/static/home
    networks:
      - microservices-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=home_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-network

volumes:
  mysql_data:
  home_images:

networks:
  microservices-network:
    driver: bridge